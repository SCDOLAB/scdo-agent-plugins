[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scdo-agent-mcp"
version = "0.1.0"
description = "MCP server (Python) for SCDO per-agent x402 wallets: Base USDC payments, signed heartbeats and booked income."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "x402", "agent", "wallet", "usdc", "base", "scdo"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = ["mcp>=1.10,<2"]

[project.scripts]
scdo-agent-mcp = "scdo_agent_mcp.server:main"

[project.urls]
Homepage = "https://scdo.com.au/linux-agent/"
Documentation = "https://scdo.com.au/linux-agent/"

[tool.hatch.build.targets.wheel]
packages = ["src/scdo_agent_mcp"]
