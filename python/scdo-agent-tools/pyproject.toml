[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scdo-agent-tools"
version = "0.5.16"
description = "SCDO x402 per-agent wallet tools for Python, LangChain and Virtuals GAME SDK: Base USDC payments, signed heartbeats and booked income."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["virtuals", "game_sdk", "x402", "agent", "wallet", "usdc", "base", "langchain", "scdo"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "pydantic>=2"]
bulk = ["eth-account>=0.10"]
virtuals = ["game_sdk>=0.1.5"]
test = ["pytest>=8"]

[project.scripts]
scdo-agent-bulk = "scdo_agent_tools.bulk:main"
scdo-agent-serve = "scdo_agent_tools.paywall:main"

[project.urls]
Homepage = "https://scdo.com.au/agent/"
Documentation = "https://scdo.com.au/agent/"

[tool.hatch.build.targets.wheel]
packages = ["src/scdo_agent_tools"]
